name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Bundle budget (first load must stay small; 3D is lazy-loaded)
        run: |
          INDEX=$(ls dist/assets/index-*.js | head -1)
          SIZE=$(gzip -c "$INDEX" | wc -c)
          echo "entry chunk gzip: $SIZE bytes"
          test "$SIZE" -lt 150000
          if grep -q 'modulepreload[^>]*three' dist/index.html; then echo "three.js must not be preloaded on the home screen"; exit 1; fi

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - run: npx playwright test --project=desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
